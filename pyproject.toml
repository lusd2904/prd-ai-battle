[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prd-ai-battle"
version = "0.1.0"
description = "Chinese Textual board for multi-model bid drafting. OpenCode is the execute/revise engine."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "prd-ai-battle" }]
dependencies = [
    "textual>=1.0.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
    "pydantic>=2.6",
    "pypdf>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[project.scripts]
prd-ai-battle = "prd_ai_battle.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
prd_ai_battle = ["py.typed", "tui/*.tcss", "data/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src", "tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
