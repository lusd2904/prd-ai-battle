# SEED defaults only (finance-platform snapshot). Copy to gitignored
# prd-ai-battle.yaml via `prd-ai-battle init` / first launch, then change
# primary, advisors, base_url, and keys. Next launch reads the local yaml,
# not this file.
#
# Keys are NEVER stored in git. Copy prd-ai-battle.env.example → gitignored
# prd-ai-battle.env (names only in the example). `prd-ai-battle config set
# --primary-key …` also writes the env file (loaded into the environment).


workspace: .prd-ai-battle
offline: false

# Optional grok2api backup (may 429 on credits — reachable, not healthy).
# Speaks grok-4.5 / grok-composer-2.5-fast, NOT Claude. Copy key names from
# prd-ai-battle.env.example → gitignored prd-ai-battle.env.
# Primary/advisors override base_url below (xixi / OpenRouter).
#
# Mac host default is 127.0.0.1. From a Linux Docker container the loopback
# is the container itself — set PRD_AI_GATEWAY_URL to
# http://host.docker.internal:8000/v1 (compose extra_hosts already maps it).
# Do not change this seed default to a cloud host.
gateway:
  base_url: ${PRD_AI_GATEWAY_URL:-http://127.0.0.1:8000/v1}
  api_key: ${PRD_AI_GATEWAY_KEY:-}

primary:
  id: primary
  model: claude-opus-5
  base_url: https://xixiapi.io/v1
  api_key_env: PRD_SFP_XIXI_KEY
  temperature: 0.3

advisors:
  - id: advisor-sonnet
    model: claude-sonnet-5
    base_url: https://xixiapi.io/v1
    api_key_env: PRD_SFP_XIXI_KEY
    temperature: 0.5
  - id: advisor-grok
    model: x-ai/grok-4.6
    base_url: https://openrouter.ai/api/v1
    api_key_env: PRD_SFP_OPENROUTER_KEY
    temperature: 0.5

# Optional Mac speakers — NOT on the seed team. Each supports BOTH:
#   (1) transport: http + base_url + api_key_env  (OpenAI-compat)
#   (2) transport: cli + command:  (local tool already on the Mac)
#
# Point primary or an advisor at one with `prd-ai-battle config set`:
#   --primary-transport cli --primary-command codex --primary-model gpt-5-codex
#   --advisor-id advisor-claude --add-advisor --transport cli --command claude
#   --advisor-id advisor-agy --add-advisor --transport cli --command antigravity
#   --primary-transport cli --primary-command grok --primary-model grok-4
#
# Commands / binaries (missing = doctor/ping "missing", init still works):
#   codex         Codex CLI (`codex exec`); or `opencode auth` / `codex login`
#   claude        Claude Code CLI (`claude -p`) — not the xixi HTTP Claude path
#   antigravity   反重力: prefer `agy`, then `antigravity`, then Gemini CLI `gemini`
#   gemini        Gemini CLI fallback when Antigravity is not installed
#   grok          Grok CLI (`grok -p`); local HTTP tool is grok2api at :8000
#
# HTTP alternatives (do not hardcode vendor hosts here — set base_url yourself):
#   Codex / Claude Code / Gemini: your OpenAI-compat root + PRD_*_KEY
#   Official xAI: base_url https://api.x.ai/v1 + PRD_XAI_KEY (not OpenRouter)
