# Copy to prd-ai-battle.yaml (or pass --config) and fill in env vars.
# Keys are never stored here — only env var names.

workspace: .prd-ai-battle
offline: false   # true = mock models, no network (good first run)

primary:
  id: primary
  base_url: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
  api_key_env: OPENAI_API_KEY
  model: gpt-4o
  temperature: 0.3

advisors:
  - id: advisor-a
    base_url: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
    api_key_env: OPENAI_API_KEY
    model: gpt-4o-mini
    temperature: 0.5
  - id: advisor-b
    base_url: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
    api_key_env: DEEPSEEK_API_KEY
    model: deepseek-chat
    temperature: 0.5
