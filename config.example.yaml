# Local multi-key gateway (OpenAI-compatible Chat Completions).
# Copy to prd-ai-battle.yaml (or pass --config).
#
# base_url and api_key come from this file and/or env vars.
# The checked-in default is the loopback gateway — never a vendor host.
# An optional external tunnel belongs only in YOUR yaml/env, not in this repo.
# Finance-platform (SFP) Mac-local models: copy config.sfp.example.yaml instead
# (keys via env only; never commit secrets; do not run on the shared cloud hub).

workspace: .prd-ai-battle
offline: false   # true = mock models, no network

gateway:
  base_url: ${PRD_AI_GATEWAY_URL:-http://127.0.0.1:4000/v1}
  api_key: ${PRD_AI_GATEWAY_KEY:-}

primary:
  id: primary
  model: gpt-4o          # id your local gateway understands
  temperature: 0.3
  # inherit gateway.base_url + gateway.api_key
  # override per model if needed:
  # base_url: ${PRD_AI_GATEWAY_URL:-http://127.0.0.1:4000/v1}
  # api_key: ${PRD_AI_GATEWAY_KEY:-}
  # api_key_env: MY_OTHER_KEY

advisors:
  - id: advisor-a
    model: gpt-4o-mini
    temperature: 0.5
  - id: advisor-b
    model: deepseek-chat
    temperature: 0.5
