# Product model routing. Copy to prd-ai-battle.yaml (or pass --config).
#
# Keys are NEVER stored in git. Export the env vars on your Mac:
#   PRD_SFP_XIXI_KEY          — https://xixiapi.io/v1
#   PRD_SFP_OPENROUTER_KEY    — https://openrouter.ai/api/v1
#   PRD_AI_GATEWAY_KEY        — optional local backup gateway
#
# base_url is the OpenAI-compatible Chat Completions root (no trailing key).

workspace: .prd-ai-battle
offline: false

# Optional backup (currently may 429 on credits). Primary/advisors override below.
gateway:
  base_url: ${PRD_AI_GATEWAY_URL:-http://127.0.0.1:8000/v1}
  api_key: ${PRD_AI_GATEWAY_KEY:-}

primary:
  id: primary
  model: claude-opus-5
  base_url: https://xixiapi.io/v1
  api_key_env: PRD_SFP_XIXI_KEY
  temperature: 0.3

advisors:
  - id: advisor-sonnet
    model: claude-sonnet-5
    base_url: https://xixiapi.io/v1
    api_key_env: PRD_SFP_XIXI_KEY
    temperature: 0.5
  - id: advisor-grok
    model: x-ai/grok-4.6
    base_url: https://openrouter.ai/api/v1
    api_key_env: PRD_SFP_OPENROUTER_KEY
    temperature: 0.5
