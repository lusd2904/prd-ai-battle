name: pytest

on:
  push:
  pull_request:

jobs:
  unit:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package (dev extras)
        run: pip install -e ".[dev]"
      - name: Run unit tests (offline / mocked HTTP only)
        run: pytest -q
        env:
          # Never hit live providers from CI.
          PRD_SFP_XIXI_KEY: ""
          PRD_SFP_OPENROUTER_KEY: ""
          PRD_AI_GATEWAY_KEY: ""
